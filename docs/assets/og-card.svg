<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Share card for https://zozo123.github.io/rust-china-conf/. Render: rsvg-convert -w 1200 -h 630 og-card.svg -o og-card.png -->
  <rect width="1200" height="630" fill="#10171d"/>
  <rect x="0" y="0" width="1200" height="6" fill="#f0b85d"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="64" y="120" font-size="24" fill="#f0b85d">Rust China Conf talk</text>
    <text x="64" y="208" font-size="56" font-weight="700" fill="#edf2f4" letter-spacing="-1.5">A Million Compiles.</text>
    <text x="64" y="276" font-size="56" font-weight="700" fill="#edf2f4" letter-spacing="-1.5">One Robot Hour.</text>
    <text x="64" y="352" font-size="26" fill="#b1bec8">The robot succeeded.</text>
    <text x="64" y="390" font-size="26" fill="#b1bec8">The freshness contract failed.</text>

    <line x1="64" y1="480" x2="560" y2="480" stroke="#435361" stroke-width="1"/>
    <text x="64" y="528" font-size="30" font-weight="700" fill="#edf2f4">Yossi Eliaz</text>
    <text x="64" y="566" font-size="22" fill="#b1bec8">Rust + simulation demo · no physical robot</text>
  </g>

  <g transform="translate(624,96)">
    <rect x="0" y="0" width="520" height="438" fill="#0b1116" stroke="#435361" stroke-width="1.5"/>
    <g font-family="Menlo, ui-monospace, monospace" font-size="15" fill="#b1bec8">
      <text x="18" y="31">robosuite / MuJoCo</text>
      <text x="502" y="31" text-anchor="end" fill="#f0b85d">600 ms-old observations</text>
    </g>
    <image x="4" y="50" width="512" height="384" xlink:href="robot-stale_600ms-poster.png" href="robot-stale_600ms-poster.png"/>
  </g>
</svg>
