[workspace]
resolver = "2"
members = [
    "crates/robot-safety-gate",
    "crates/swf-app",
    "crates/swf-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"

# The dependency graph above is deliberate: it is the measured compilation
# workload for the cold/warm runner comparison. Do not add unused
# dependencies to inflate build times (see docs/talk, performance section).
