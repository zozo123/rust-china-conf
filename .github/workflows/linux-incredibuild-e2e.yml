name: Linux Incredibuild E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Ubuntu 22.04 / Incredibuild / robosuite
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      MUJOCO_GL: osmesa
      REQUIRE_IB: "1"

    steps:
      - name: Check out seeded demo revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Provision Rust and simulator prerequisites
        run: |
          set -euo pipefail
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libglfw3 libglew2.2 libosmesa6 libevdev-dev patchelf
          python3 -m venv demo/robot-sim/.venv
          demo/robot-sim/.venv/bin/python3 -m pip install --upgrade pip
          demo/robot-sim/.venv/bin/python3 -m pip install \
            -r demo/robot-sim/requirements-linux.txt

      - name: Install licensed Incredibuild Initiator
        env:
          IB_INSTALL_SCRIPT: ${{ secrets.IB_INSTALL_SCRIPT }}
        run: |
          set -euo pipefail
          set +x
          test -n "${IB_INSTALL_SCRIPT:-}" || {
            echo "IB_INSTALL_SCRIPT secret is missing" >&2
            exit 1
          }
          printf '%s' "$IB_INSTALL_SCRIPT" > /tmp/install_incredibuild.sh
          unset IB_INSTALL_SCRIPT
          chmod 700 /tmp/install_incredibuild.sh

          # GitHub-hosted runners are Initiators. Disable the 10 GB local
          # Helper cache; keep Coordinator + Initiator and a 1 GB local
          # compilation cache. The broker credential remains masked and
          # exists only in this ephemeral runner.
          sed -i 's/--helper enabled/--helper disabled/' /tmp/install_incredibuild.sh
          sed -i '/--initiator enabled/a\  --local-build-cache-size 1 \\' \
            /tmp/install_incredibuild.sh
          sudo /tmp/install_incredibuild.sh /incredibuild
          shred -u /tmp/install_incredibuild.sh || rm -f /tmp/install_incredibuild.sh

          IB_CONSOLE="$(sudo find /opt/incredibuild /incredibuild \
            -type f -name ib_console -perm -111 2>/dev/null | head -1)"
          test -n "$IB_CONSOLE" || {
            echo "ib_console was not installed" >&2
            exit 1
          }
          echo "$(dirname "$IB_CONSOLE")" >> "$GITHUB_PATH"
          "$IB_CONSOLE" --version || "$IB_CONSOLE" --help >/dev/null

      - name: Strict preflight
        env:
          ROBOT_DEMO_PYTHON: ${{ github.workspace }}/demo/robot-sim/.venv/bin/python3
        run: scripts/robot-demo/preflight.sh

      - name: Run full seeded-to-fixed SIL rehearsal through Incredibuild
        env:
          ROBOT_DEMO_BACKEND: robosuite
          ROBOT_DEMO_PYTHON: ${{ github.workspace }}/demo/robot-sim/.venv/bin/python3
        run: |
          set -euo pipefail
          RUN_ID="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          scripts/robot-demo/rehearse.sh "$RUN_ID"

      - name: Prove both compilation phases used Incredibuild
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["RUN_ID"]
          phases = {}
          for runner in ("runner-a", "runner-b"):
              path = Path("evidence") / f"{run_id}-{runner}" / "build-metrics.jsonl"
              records = [json.loads(line) for line in path.read_text().splitlines()]
              if len(records) != 1:
                  raise SystemExit(f"{path}: expected one build record, got {len(records)}")
              record = records[0]
              if record.get("ib") is not True:
                  raise SystemExit(f"{path}: Incredibuild was not used: {record}")
              phases[record["phase"]] = record["wall_ms"]
          if set(phases) != {"cold", "warm"}:
              raise SystemExit(f"missing build phases: {phases}")
          print(f"INcredibuild E2E PASS: cold={phases['cold']}ms warm={phases['warm']}ms")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-incredibuild-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/gha-${{ github.run_id }}-${{ github.run_attempt }}-runner-a/
            evidence/gha-${{ github.run_id }}-${{ github.run_attempt }}-runner-b/
          if-no-files-found: warn
          retention-days: 14
